# vaultcrypt Global Configuration
# This file is symlinked to ~/.vaultcrypt.conf

# [SECURITY]
iterations=600000

# [PERFORMANCE]
fast=true

# [KEYCHAIN]
keychain-service=vaultcrypt

# [NAMING]
manifest-name=.vaultcrypt-manifest.vlt

# [EXCLUSIONS]

# --- OS Artifacts ---
exclude=.DS_Store
exclude=.AppleDouble
exclude=.LSOverride
exclude=Icon
exclude=._*
exclude=.Spotlight-V100
exclude=.Trashes
exclude=Thumbs.db
exclude=Desktop.ini
exclude=.directory
exclude=.fuse_hidden*
exclude=.Trash-*

# --- IDEs & Editors ---
exclude=.vscode/*
exclude=*.code-workspace
exclude=.idea/
exclude=*.iws
exclude=*.iml
exclude=*.ipr
exclude=out/
exclude=.*.sw[a-p]
exclude=*.un~
exclude=Session.vim
exclude=.netrwhist
exclude=*.sublime-workspace
exclude=*.sublime-project

# --- Build Artifacts & Caches ---
exclude=node_modules/
exclude=npm-debug.log*
exclude=yarn-debug.log*
exclude=yarn-error.log*
exclude=__pycache__/
exclude=*.py[cod]
exclude=.Python
exclude=env/
exclude=venv/
exclude=.env/
exclude=.venv/
exclude=*.o
exclude=*.obj
exclude=*.out
exclude=*.app
exclude=*.exe
exclude=*.dll
exclude=*.so
exclude=*.dylib
exclude=*.class

# --- Logs & Archives ---
exclude=logs/
exclude=*.log
exclude=*.7z
exclude=*.dmg
exclude=*.gz
exclude=*.iso
exclude=*.jar
exclude=*.rar
exclude=*.tar
exclude=*.zip

# --- Secrets ---
exclude=*.pem
exclude=*.key
exclude=*.cert
