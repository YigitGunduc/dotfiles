# Minimal tmux config, no plugins. Prefix is Ctrl-a.
# Works on tmux 3.0+ (older Ubuntu/Pi) and current Homebrew tmux.

########################################
# General
########################################
set -g prefix C-a
unbind C-b
bind C-a send-prefix        # Ctrl-a Ctrl-a sends a literal Ctrl-a (start of line)

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on  # no gaps after closing a window
set -g history-limit 100000
set -sg escape-time 10      # no delay after Esc in vim
set -g focus-events on      # lets vim notice files changed outside it
set -g set-titles on

# True color so vim's gruvbox (termguicolors) looks the same inside tmux.
set -g default-terminal "tmux-256color"
if-shell '! infocmp tmux-256color >/dev/null 2>&1' 'set -g default-terminal "screen-256color"'
set -ga terminal-overrides ",*256col*:Tc"

########################################
# Keys (vim-flavored)
########################################
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# Splits and new windows open in the current directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Ctrl-h/j/k/l moves between panes, like vim splits. Inside vim (and fzf)
# the keys go to the program instead.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +([^ ]+/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind C-l send-keys C-l      # prefix Ctrl-l clears the screen

# prefix H/J/K/L resizes (repeatable).
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

########################################
# Copy mode: vi keys, system clipboard
########################################
setw -g mode-keys vi
set -s set-clipboard on     # OSC 52: clipboard works over SSH in most terminals
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
if-shell 'command -v pbcopy >/dev/null 2>&1' \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel pbcopy; bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel pbcopy'

########################################
# Look (gruvbox dark)
########################################
set -g status-style "bg=#3c3836,fg=#ebdbb2"
set -g status-left-length 30
set -g status-left "#[bg=#d79921,fg=#282828,bold] #S #[default] "
set -g status-right "#[fg=#a89984]%H:%M  #h "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=#504945,fg=#fabd2f,bold] #I:#W #[default]"
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#d79921"
set -g message-style "bg=#504945,fg=#ebdbb2"
setw -g mode-style "bg=#504945,fg=#fabd2f"
